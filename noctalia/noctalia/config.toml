# Noctalia configuration
# stow --target=$HOME/.config noctalia

[shell]
setup_wizard_enabled = false

[theme]
mode = "dark"
source = "builtin"
builtin = "Catppuccin"

[bar.main]
anchor = "top"
height = 40

[bar.main.widgets]
left = ["launcher", "workspaces"]
center = ["active_window"]
right = ["tray", "network", "volume", "battery", "clock", "session"]

[wallpaper]
enabled = true
fill_mode = "crop"
directory = "/run/current-system/sw/share/wallpapers"

[idle.behavior]
timeout = 300
command = "noctalia msg session lock"
